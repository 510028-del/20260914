<html>
    <head>
        <title>0921-CSS簡介</title>
        <style> /* CSS的註解 */ /* CSS又稱樣式表 */
        /* 選擇器;selectcr 有三種 標籤名稱 #id .class */
        /*
             display: block/inline/inline-block;
             widch: px; pixal像素
             height: px;

             colar: 前景顏色
             background-colar: 背景顏色
             

             顏色的設定方法:
             1.英文單字
             2.rgb(0~255,0~255<0~255)
             3.rgb(0~255,0~255<0~1)//0全透明~1不透明
             4.色碼 #RRGGBB  00~FF
             5.hsl(色相0~360<彩度0~100%,亮度0~100%)
             6.hsla(色相0~360<彩度0~100%,亮度0~100%,透明度0~1)//0全透明~1不透明
             */
            p {
               background-color:  rgb(224, 221, 221);
            }
            #p1 {
               background-color: lightblue;
            }
            .c1 {
                color: red;
            }
            #d1 {
                background-color: rgb(119, 132, 204);
                height: 500px;
                width: 500px;
            }
      </style>
    </head>
    <body>
        <p id="p1"  class="c1">第一個段落<br>123</p>
        <p>第二個段落</p>
        <p class="c1">第三個段落</p>
        <div id="d1" class="dc1"></div>
        <div class="d1"></div>
    </body>
</html>
